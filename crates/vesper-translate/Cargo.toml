[package]
name = "vesper-translate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Offline machine translation for second-language slides: OPUS-MT (Marian) models on candle, Vesper's own small model store"

[dependencies]
model = { path = "../model" }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
anyhow = "1.0.104"
tracing = "0.1.44"
# The tokenizer pieces of `spm`: the same crate and features candle-core already builds.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# The engine's own small, low-priority thread pool (candle computes on rayon).
rayon = "1.7"
# Model downloads: HTTPS with the same rustls (ring) the server already builds.
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[package]
name = "vesper-scripture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Vesper's scripture module: Bible translation files, reference parsing, passages, search, slides from a passage and the /api/v1/scripture routes"

[dependencies]
vesper-core = { path = "../vesper-core" }
protocol = { path = "../protocol" }
model = { path = "../model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = "0.8.9"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"

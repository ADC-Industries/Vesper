[package]
name = "media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Video and sound decoding through IDN's FFmpeg adapter (system FFmpeg, GPU first), per-video players, media clocks, video thumbnails"

[dependencies]
anyhow = "1.0.104"
log = "0.4.34"
# FFmpeg comes from the system (apt), linked dynamically through pkg-config: never vendored,
# never built from source, never static (see ARCHITECTURE.md, "Media dependency policy").
# IDN's FFmpeg adapter (same system FFmpeg, decode-only: no capture/WHEP/voice extras).
idn-ffmpeg = { git = "https://github.com/ADC-Industries/idn-open-protocol", tag = "v0.3.8-Beta18", default-features = false }
# The codec named in a file conversion (`idn_ffmpeg::media::ConvertConfig::codec`).
idn-open-protocol = { git = "https://github.com/ADC-Industries/idn-open-protocol", tag = "v0.3.8-Beta18" }

[dev-dependencies]
render = { path = "../render" }
model = { path = "../model" }

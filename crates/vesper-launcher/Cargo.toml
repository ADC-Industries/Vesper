[package]
name = "vesper-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Vesper Launcher: installs, updates (signed, with automatic rollback), starts and monitors the Vesper products on a machine; its local API; minisign-compatible package signatures"

[lib]
name = "vesper_launcher"
path = "src/lib.rs"

[[bin]]
name = "vesper-launcher"
path = "src/main.rs"

[dependencies]
# `discover`: the Vesper servers on the LAN (mDNS), for the first-run wizard.
protocol = { path = "../protocol", features = ["discover"] }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time", "process", "io-util"] }
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gethostname = "1.1.0"
uuid = { version = "1.28.0", features = ["v4"] }
# Package signatures: Ed25519 in minisign's format (prehashed with BLAKE2b-512), see `sign`.
ed25519-dalek = "2.2.0"
blake2 = "0.10.6"
base64 = "0.22.1"
sha2 = "0.11.1"
getrandom = "0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# The IDN Node service's program, from the service manager (`idn_node::windows_service_image`).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Services"] }

[dev-dependencies]
tempfile = "3.27.0"

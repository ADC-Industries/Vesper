[package]
name = "protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wire types of the control protocol (REST + WebSocket), TypeScript bindings, mDNS discovery"

[dependencies]
model = { path = "../model", features = ["ts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "no-serde-warnings"] }
uuid = "1.28.0"
mdns-sd = { version = "0.21.6", optional = true }

[features]
# mDNS discovery helper (`protocol::discover`), for clients such as the control app.
discover = ["dep:mdns-sd"]

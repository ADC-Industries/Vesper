[package]
name = "vesper-site"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Vesper server's site: its IDN Site Manager as a module, joins, devices, users, paired clients' keys, who a request comes from, and the /api/v1/site routes"

[dependencies]
vesper-core = { path = "../vesper-core" }
protocol = { path = "../protocol" }
# The site's Site Manager, embedded, and the trust types it is driven with (JoinMode, the
# authority's requests, devices and alerts).
idn-site-manager = { git = "https://github.com/ADC-Industries/idn-open-protocol", tag = "v0.3.8-Beta18" }
idn-open-protocol = { git = "https://github.com/ADC-Industries/idn-open-protocol", tag = "v0.3.8-Beta18" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "sync"] }
axum = "0.8.9"
sha2 = "0.11.1"
getrandom = "0.4.3"
# The site's admin PIN, stored as an Argon2id hash (the same crate and version the IDN library
# hashes the site password with: already in the build).
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
gethostname = "1.1.0"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
